<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Doc Manager — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .admin-shell{display:flex;min-height:100vh;}
  .admin-side{width:220px;background:var(--navy-deep);color:#fff;padding:18px 12px;flex-shrink:0;}
  .admin-side .brand{padding:0 8px 18px;border-bottom:1px solid #1C2E58;margin-bottom:12px;}
  .admin-side .brand h1{font-size:14px;color:#fff;margin:0;}
  .admin-side .brand p{color:#8494BD;font-size:10.5px;margin:2px 0 0;}
  .side-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:12.5px;font-weight:500;color:#AEB9D6;cursor:pointer;margin-bottom:2px;}
  .side-item .ic{width:16px;text-align:center;font-size:13px;}
  .side-item:hover{background:#122451;}
  .side-item.active{background:var(--gold);color:#3A2200;font-weight:700;}
  .admin-main{flex:1;padding:24px 30px;min-width:0;max-width:1100px;}
  .admin-main-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .admin-main-head h2{margin:0;font-size:18px;}
  .admin-main-head p{margin:2px 0 0;font-size:12px;color:var(--text-soft);}
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  .kpi{background:#F8F9FC;border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .kpi .num{font-size:24px;font-weight:700;}
  .kpi .lbl{font-size:11px;color:var(--text-soft);margin-top:2px;}
  .kpi.k-green .num{color:var(--green);} .kpi.k-orange .num{color:var(--orange);} .kpi.k-blue .num{color:var(--blue);}
  .panel{background:#F8F9FC;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
  .panel h3{margin:0 0 12px;font-size:13px;}
  .bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding:0 4px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar-col .bar{width:100%;border-radius:5px 5px 0 0;}
  .bar-col .lbl{font-size:9.5px;color:var(--text-soft);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--text-soft);font-weight:600;font-size:11px;padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.03em;}
  td{padding:10px;border-bottom:1px solid var(--line);}
  tr.tbl-row{cursor:pointer;}
  tr.tbl-row:hover{background:#F3F5FA;}
  .progress-mini{width:70px;height:6px;background:#E9ECF3;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px;}
  .progress-mini i{display:block;height:100%;background:var(--gold);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .toolbar input{flex:1;max-width:280px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-field label{font-size:11px;font-weight:600;color:var(--text-soft);display:block;margin-bottom:5px;}
  .form-field input,.form-field select,.form-field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;font-family:inherit;}
  .status-choice{display:flex;gap:8px;}
  .status-choice .opt{flex:1;text-align:center;padding:9px;border-radius:8px;border:1.5px solid var(--line);font-size:11.5px;font-weight:600;color:var(--text-soft);cursor:pointer;}
  .status-choice .opt.sel{border-color:var(--gold);background:#FEF1DD;color:#946400;}
  .flow-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);}
  .flow-row .num{width:24px;height:24px;border-radius:50%;background:var(--gray);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .flow-row.done .num{background:var(--green);}
  .flow-row.current .num{background:var(--orange);}
  .flow-row .lbl{flex:1;font-size:12.5px;font-weight:600;}
  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  .login-card{max-width:360px;margin:80px auto;background:var(--card);padding:30px;border-radius:14px;box-shadow:var(--shadow);}
  @media (max-width:900px){.admin-shell{flex-direction:column;} .admin-side{width:100%;display:flex;overflow-x:auto;} .two-col{grid-template-columns:1fr;} .kpi-row{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="/config.js"></script>
<script src="/admin.js"></script>
</body>
</html>
